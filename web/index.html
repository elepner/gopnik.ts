<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Гопник</title>
    <style>
      :root {
        --red: #ff5555;
        --yellow: #ffff55;
        --green: #55ff55;
        --cyan: #55ffff;
        --gray: #aaaaaa;
        --dim: #555555;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      #root,
      .shell {
        height: 100%;
      }
      .shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .game {
        display: grid;
        grid-template-columns: auto auto;
        gap: 12px;
      }
      .panel {
        /* as high as the screen: the panel scrolls instead of pushing the screen */
        height: 0;
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        gap: 18px;
        padding: 12px 14px;
        background: #000;
        border-radius: 6px;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
        font:
          14px ui-monospace,
          Menlo,
          Consolas,
          'Courier New',
          monospace;
        color: var(--gray);
        overflow: auto;
      }
      .panel .column {
        width: 220px;
      }
      .panel .column + .column {
        padding-left: 18px;
        border-left: 1px dashed var(--dim);
      }
      .panel h2 {
        margin: 0;
        font-size: 16px;
        color: #ffffff;
      }
      .panel .enemy h2 {
        color: var(--red);
      }
      .panel .sub {
        margin: 2px 0 8px;
        color: var(--dim);
      }
      .panel dl {
        margin: 8px 0 0;
      }
      .panel dl div {
        display: flex;
        justify-content: space-between;
        line-height: 1.45;
      }
      .panel dd {
        margin: 0;
        color: #ffffff;
      }
      .bar {
        margin-bottom: 6px;
      }
      .bar-label {
        display: flex;
        justify-content: space-between;
      }
      .bar-track {
        height: 6px;
        margin-top: 2px;
        background: #222;
      }
      .bar-fill {
        height: 100%;
      }
      .things {
        margin-top: 10px;
        line-height: 1.4;
        color: #ffffff;
      }
      .things h3 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: normal;
        color: var(--gray);
      }
      .hurt {
        margin-top: 8px;
        color: var(--red);
      }
      .boost {
        color: #5555ff;
      }
      .spare {
        color: var(--dim);
      }
      .screen {
        padding: 12px;
        background: #000;
        border-radius: 6px;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.8);
      }
      .again {
        font: 16px monospace;
        padding: 8px 20px;
        color: #ffff55;
        background: #0000aa;
        border: 2px solid #aaaaaa;
        cursor: pointer;
      }

      /* buttons instead of a keyboard (phones) */
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 48px;
      }
      .actions button {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 64px;
        padding: 6px 10px;
        font:
          13px ui-monospace,
          Menlo,
          Consolas,
          'Courier New',
          monospace;
        color: #ffffff;
        background: #000;
        border: 1px solid var(--dim);
        border-radius: 6px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .actions button:active {
        background: #0000aa;
      }
      .actions button b {
        font-size: 16px;
        color: var(--yellow);
      }
      .actions button small {
        color: var(--gray);
      }
      dialog.name {
        padding: 18px;
        color: #ffffff;
        background: #000;
        border: 2px solid var(--gray);
        border-radius: 6px;
        font:
          16px ui-monospace,
          Menlo,
          Consolas,
          'Courier New',
          monospace;
      }
      dialog.choice {
        min-width: 260px;
        padding: 18px;
        color: #ffffff;
        background: #000;
        border: 2px solid var(--gray);
        border-radius: 6px;
        font:
          16px ui-monospace,
          Menlo,
          Consolas,
          'Courier New',
          monospace;
      }
      dialog.choice h2 {
        margin: 0 0 12px;
        font-size: 16px;
        color: var(--green);
      }
      dialog.choice button {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin-top: 8px;
        padding: 8px 12px;
        font: inherit;
        text-align: left;
        color: var(--yellow);
        background: #0000aa;
        border: 1px solid var(--gray);
        cursor: pointer;
      }
      dialog.choice button small {
        color: var(--gray);
        font-size: 13px;
      }
      dialog.choice::backdrop,
      dialog.name::backdrop {
        background: rgba(0, 0, 0, 0.7);
      }
      dialog.name label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--green);
      }
      dialog.name input {
        font: inherit;
        padding: 8px;
        color: #ffffff;
        background: #111;
        border: 1px solid var(--dim);
      }
      dialog.name button {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        font: inherit;
        color: var(--yellow);
        background: #0000aa;
        border: 1px solid var(--gray);
      }

      /* a phone: you | enemy, then the screen, then the buttons */
      @media (max-width: 900px) {
        .shell {
          height: auto;
          justify-content: flex-start;
          gap: 10px;
          padding: 8px;
        }
        .game {
          grid-template-columns: 1fr;
          gap: 8px;
          width: 100%;
        }
        .panel {
          order: -1;
          height: auto;
          min-height: 0;
          gap: 10px;
          padding: 8px 10px;
          font-size: 12px;
        }
        .panel .column {
          flex: 1;
          width: auto;
          min-width: 0;
        }
        .panel .column + .column {
          padding-left: 10px;
        }
        .panel h2 {
          font-size: 14px;
        }
        .panel dl div {
          line-height: 1.3;
        }
        .screen {
          padding: 6px;
          overflow: hidden;
        }
        .actions {
          width: 100%;
          justify-content: center;
        }
        .again {
          font-size: 13px;
          padding: 6px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
